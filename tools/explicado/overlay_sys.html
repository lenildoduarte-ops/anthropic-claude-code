<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--y:#ffd400;--card:rgba(13,19,34,.97);--line:rgba(255,212,0,.35);--g:#33d17a;--r:#ff5a5a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif;color:#fff}
.abs{position:absolute}
.card{left:90px;right:90px;top:250px;background:var(--card);border:2px solid var(--line);border-radius:36px;padding:44px 48px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,212,0,.08),0 0 60px rgba(255,212,0,.12)}
.eyebrow{font:800 26px Inter;letter-spacing:.22em;text-transform:uppercase;color:var(--y);margin-bottom:18px}
.title{font:900 58px/1.05 Inter;letter-spacing:-.01em}
.row{display:flex;align-items:center;gap:26px;margin-top:30px;font:800 46px Inter}
.ico{width:92px;height:92px;border-radius:24px;background:rgba(255,212,0,.14);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:56px;height:56px;stroke:var(--y);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hl{color:var(--y)}
.big{font-family:Anton,Impact,sans-serif;font-size:250px;line-height:.9;color:var(--y);text-align:center}
.bigl{text-align:center;font:900 54px Inter;letter-spacing:.18em;text-transform:uppercase;margin-top:10px}
.steps{left:0;right:0;top:150px;display:flex;justify-content:center;gap:12px}
.step{font:800 22px Inter;letter-spacing:.12em;text-transform:uppercase;padding:10px 18px;border-radius:999px;background:rgba(13,19,34,.97);color:rgba(255,255,255,.55);border:2px solid transparent}
.step.on{color:#111;background:var(--y)}
.chk{width:56px;height:56px;border-radius:50%;border:4px solid var(--g);display:flex;align-items:center;justify-content:center;flex:none}
.chk svg{width:32px;height:32px;stroke:var(--g);fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.tog{width:150px;height:78px;border-radius:999px;position:relative;flex:none}
.knob{position:absolute;top:9px;width:60px;height:60px;border-radius:50%;background:#fff}
.sub{left:60px;right:60px;top:1290px;text-align:center;font:900 62px/1.12 Inter;text-transform:uppercase;letter-spacing:-.005em;
  text-shadow:0 4px 0 #000,0 0 18px rgba(0,0,0,.85),3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000}
.sub{display:flex;flex-wrap:wrap;justify-content:center;column-gap:30px;row-gap:4px}.sub span{display:inline-block}
.sub span.on{color:var(--y);transform:scale(1.04)}
.fun{display:flex;align-items:center;gap:22px;margin-top:34px}
.box{flex:1;border-radius:26px;padding:26px 20px;text-align:center;font:900 40px Inter;border:3px solid var(--line)}
.arrow{font:900 60px Inter;color:var(--y)}
</style></head><body>
<div id="steps" class="abs steps"></div>
<div id="stage"></div>
<div id="sub" class="abs sub"></div>
<script>
const W=[["100%", 0.0], ["personalizada,", 0.42], ["com", 1.5], ["o", 2.1], ["treinamento", 2.4], ["online", 2.9], ["para", 3.3], ["quem", 3.62], ["vai", 4.0], ["operar", 4.18], ["e", 4.68], ["principalmente", 4.92], ["para", 5.46], ["quem", 5.9], ["vai", 6.12], ["controlar", 6.46], ["essa", 7.6], ["demanda,", 7.96], ["para", 8.74], ["quem", 9.18], ["vai", 9.34], ["estar", 9.48], ["à", 9.64], ["frente", 9.82], ["ali", 9.98], ["fazendo", 10.28], ["a", 10.6], ["gestão.", 10.8], ["Justamente", 12.16], ["para", 12.6], ["você", 12.84], ["entender", 13.48], ["de", 13.88], ["fato", 14.14], ["os", 14.32], ["números,", 14.58], ["quem", 15.18], ["são,", 15.22], ["o", 15.74], ["que", 15.84], ["que", 15.94], ["tem", 16.08], ["que", 16.22], ["personalizar,", 16.32], ["o", 17.3], ["que", 17.34], ["que", 17.42], ["pode", 17.54], ["mudar", 17.78], ["no", 18.12], ["atendimento,", 18.36], ["principalmente", 19.68], ["quando", 20.08], ["não", 20.58], ["se", 20.8], ["tem", 21.0], ["o", 21.2], ["comercial", 21.44], ["ativo,", 21.9], ["vamos", 22.88], ["dizer", 23.2], ["fora", 23.36], ["do", 23.56], ["horário", 23.68], ["comercial,", 23.82], ["para", 24.76], ["que", 25.68], ["você", 25.84], ["tenha", 26.06], ["um", 26.52], ["atendimento", 27.5], ["e", 28.2], ["um", 28.46], ["fechamento", 28.58], ["cada", 28.96], ["vez", 29.2], ["mais", 29.44], ["efetivo.", 29.68]];
const I={
 laptop:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19h20"/></svg>',
 headset:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
 chart:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
 chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg>',
 moon:'<svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
 trend:'<svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>'};
const tick='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), eo=p=>1-Math.pow(1-p,3), back=p=>{const c=1.7;p=p-1;return 1+(c+1)*p*p*p+c*p*p};
// visibility with pop-in / fade-out
function vis(t,a,b,d=.28){const pi=cl((t-a)/d),po=cl((b-t)/.22);return {o:Math.min(eo(pi),po),s:.86+.14*back(pi),y:(1-eo(pi))*40}}
function st(v){return `opacity:${v.o};transform:translateY(${v.y}px) scale(${v.s});`}
function item(t,a,d=.3){const p=cl((t-a)/d);return `opacity:${eo(p)};transform:translateX(${(1-eo(p))*-60}px);`}
const SC=[[0,2.15],[2.25,11.3],[12.05,17.2],[17.3,24.55],[24.7,31.6]];
function scene(t){
 let h='';
 // 1: 100%
 let v=vis(t,0,2.15,.2);
 if(v.o>0){const n=Math.round(100*eo(cl(t/.7)));h+=`<div class="abs card" style="${st(v)}"><div class="big">${n}%</div><div class="bigl">Personalizada</div></div>`}
 v=vis(t,2.25,11.3);
 if(v.o>0){const g=t>=10.75;h+=`<div class="abs card" style="${st(v)}"><div class="eyebrow">Implementação</div>
 <div class="row" style="margin-top:0">${'<div class="ico">'+I.laptop+'</div>'}<div class="title">Treinamento <span class="hl">online</span></div></div>
 <div class="row" style="${item(t,4.0)}"><div class="ico">${I.headset}</div><div>Para quem <span class="hl">opera</span></div></div>
 <div class="row" style="${item(t,6.4)}"><div class="ico">${I.chart}</div><div>Para quem faz a <span class="hl" style="${g?'background:var(--y);color:#111;padding:0 12px;border-radius:10px':''}">gestão</span></div></div></div>`}
 v=vis(t,12.05,17.2);
 if(v.o>0){const L=[["Os números",14.5],["Quem são os clientes",15.15],["O que personalizar",16.3]];
  h+=`<div class="abs card" style="${st(v)}"><div class="eyebrow">Para você entender</div><div class="title">De fato, <span class="hl">na prática:</span></div>`+
  L.map(([s,a])=>`<div class="row" style="${item(t,a,.25)}"><div class="chk" style="transform:scale(${.5+.5*back(cl((t-a-.1)/.25))})">${tick}</div><div>${s}</div></div>`).join('')+`</div>`}
 v=vis(t,17.3,24.55);
 if(v.o>0){const off=eo(cl((t-21.3)/.35));const bg=`rgb(${Math.round(51+(255-51)*off)},${Math.round(209-(209-90)*off)},${Math.round(122-(122-90)*off)})`;
  h+=`<div class="abs card" style="${st(v)}"><div class="eyebrow">O que muda no</div><div class="row" style="margin-top:0"><div class="ico">${I.chat}</div><div class="title">Atendimento</div></div>
  <div class="row" style="${item(t,19.65)}"><div class="tog" style="background:${bg}"><div class="knob" style="left:${81-72*off}px"></div></div><div>Comercial ativo: <span style="color:${off>.5?'var(--r)':'var(--g)'}">${off>.5?'OFF':'ON'}</span></div></div>
  <div class="row" style="${item(t,23.3)}"><div class="ico">${I.moon}</div><div>Fora do horário <span class="hl">comercial</span></div></div></div>`}
 v=vis(t,24.7,31.6);
 if(v.o>0){const p=eo(cl((t-29.0)/1.2));
  h+=`<div class="abs card" style="${st(v)};top:235px;padding-top:36px;padding-bottom:34px"><div class="eyebrow">Resultado</div><div class="title">Cada vez mais <span class="hl">efetivo</span></div>
  <div class="fun"><div class="box" style="${item(t,27.4)}">Atendimento</div><div class="arrow" style="${item(t,28.1)}">→</div><div class="box" style="${item(t,28.4)};background:var(--y);color:#111;border-color:var(--y)">Fechamento</div></div>
  <svg viewBox="0 0 860 200" style="width:100%;height:130px;margin-top:24px;overflow:visible">
   <path d="M10 185 L200 150 L380 160 L560 95 L850 20" fill="none" stroke="#ffd400" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1-p}"/>
   <circle cx="850" cy="20" r="${16*p}" fill="#ffd400"/></svg></div>`}
 document.getElementById('stage').innerHTML=h;
 // steps
 const names=["Treinamento","Números","Atendimento","Resultado"];const cur=t<12?0:t<17.25?1:t<24.65?2:3;const so=t<2.2?0:1;
 document.getElementById('steps').style.opacity=so*(t>31.2?0:1);
 document.getElementById('steps').innerHTML=names.map((n,i)=>`<div class="step ${i==cur?'on':''}">${i+1} · ${n}</div>`).join('');
 // subtitles: chunks of max 3 words, break on punctuation
 const ch=[];let c=[];W.forEach((x,i)=>{c.push(x);if(c.length>=3||/[,.]$/.test(x[0])){ch.push(c);c=[]}});if(c.length)ch.push(c);
 let cur2=null;for(let i=0;i<ch.length;i++){const s=ch[i][0][1],e=i+1<ch.length?ch[i+1][0][1]:31.5;if(t>=s&&t<e&&t-ch[i][ch[i].length-1][1]<1.2)cur2=ch[i]}
 document.getElementById('sub').innerHTML=cur2?cur2.map((x,j)=>{const nx=j+1<cur2.length?cur2[j+1][1]:99;return `<span class="${t>=x[1]&&t<nx?'on':''}">${x[0].replace(/[,.]$/,'')}</span>`}).join(''):'';
}
window.scene=scene;
</script></body></html>
