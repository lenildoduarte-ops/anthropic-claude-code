<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#e8ecf5;
 background:radial-gradient(120% 60% at 60% 30%,#16203a 0%,#0a0f1c 60%,#060911 100%)}
.abs{position:absolute}
.top{left:0;right:0;top:0;height:120px;display:flex;align-items:center;gap:22px;padding:0 40px 0 150px;border-bottom:1px solid #1f2a44;background:rgba(10,15,28,.8)}
.logo{font:900 40px Inter;letter-spacing:-.02em}.logo b{color:#ffd400}
.crumb{font:700 24px Inter;color:#8a96b3}
.search{margin-left:auto;width:260px;height:52px;border-radius:14px;background:#141c30;border:1px solid #24304d}
.dot{width:52px;height:52px;border-radius:50%;background:#24304d}
.side{left:0;top:0;bottom:0;width:120px;background:#0b1120;border-right:1px solid #1f2a44;display:flex;flex-direction:column;align-items:center;gap:26px;padding-top:160px}
.si{width:72px;height:72px;border-radius:20px;background:#141c30;display:flex;align-items:center;justify-content:center}
.si.on{background:#ffd400}
.si svg{width:36px;height:36px;stroke:#5f6c8c;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.si.on svg{stroke:#111}
.grid{left:150px;right:36px;top:150px;display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.kpi{background:#111a2e;border:1px solid #22304e;border-radius:24px;padding:26px 28px;height:180px}
.kpi .l{font:800 20px Inter;letter-spacing:.14em;text-transform:uppercase;color:#7f8bab}
.kpi .v{font:900 64px Inter;margin-top:14px;font-variant-numeric:tabular-nums}
.kpi .d{font:800 22px Inter;color:#33d17a;margin-top:6px}
.panel{background:#111a2e;border:1px solid #22304e;border-radius:24px;padding:26px 28px}
.ph{font:800 22px Inter;letter-spacing:.12em;text-transform:uppercase;color:#7f8bab;display:flex;justify-content:space-between}
.live{color:#33d17a}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
.col{background:#0c1324;border-radius:18px;padding:16px;min-height:420px}
.col h4{font:800 20px Inter;color:#9aa6c4;margin-bottom:14px}
.lead{height:74px;border-radius:14px;background:#17213a;margin-bottom:12px;border-left:6px solid #3d6bff}
</style></head><body>
<div class="abs side" id="side"></div>
<div class="abs top"><div class="logo">elevo<b>.</b></div><div class="crumb">/ Painel Comercial</div><div class="search"></div><div class="dot"></div></div>
<div class="abs grid" id="kpis"></div>
<div class="abs panel" style="left:150px;right:36px;top:580px;height:330px"><div class="ph"><span>Fechamentos · 30 dias</span><span class="live" id="live">● ao vivo</span></div>
<svg viewBox="0 0 860 230" style="width:100%;height:240px;margin-top:10px"><defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffd400" stop-opacity=".35"/><stop offset="1" stop-color="#ffd400" stop-opacity="0"/></linearGradient></defs>
<g stroke="#1f2a44" stroke-width="1"><path d="M0 50H860M0 110H860M0 170H860"/></g>
<path id="area" fill="url(#g)"/><path id="line" fill="none" stroke="#ffd400" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/></svg></div>
<div class="abs panel" style="left:150px;right:36px;top:940px;height:640px"><div class="ph"><span>Pipeline</span><span>Hoje</span></div>
<div class="cols"><div class="col"><h4>Novo lead</h4><div class="lead"></div><div class="lead"></div><div class="lead"></div><div class="lead"></div></div>
<div class="col"><h4>Atendimento</h4><div class="lead" style="border-color:#ffd400"></div><div class="lead" style="border-color:#ffd400"></div><div class="lead" style="border-color:#ffd400"></div></div>
<div class="col"><h4>Fechado</h4><div class="lead" style="border-color:#33d17a"></div><div class="lead" style="border-color:#33d17a"></div></div></div></div>
<script>
const ic=['<path d="M4 6h16v10H4zM2 19h20"/>','<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>','<path d="M4 5h16v10H9l-5 4z"/>','<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>','<path d="M12 3v3M12 18v3M3 12h3M18 12h3"/><circle cx="12" cy="12" r="4"/>'];
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const P=[30,52,44,70,62,88,80,104,98,122,116,140,150,138,168,176,170,192,205,198];
window.scene=t=>{
 const cur=t<12?0:t<17.25?1:t<24.65?2:3;
 document.getElementById('side').innerHTML=ic.map((s,i)=>`<div class="si ${i==cur?'on':''}"><svg viewBox="0 0 24 24">${s}</svg></div>`).join('');
 const k=[["Leads hoje",Math.round(184+t*1.3),"+12%"],["Conversão",(18.4+t*0.08).toFixed(1)+"%","+3,1 p.p."],["Atend. fora do horário",Math.round(37+t*0.6),"24h ativo"],["Fechamentos",Math.round(52+t*0.35),"+18%"]];
 document.getElementById('kpis').innerHTML=k.map(([l,v,d])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">▲ ${d}</div></div>`).join('');
 const n=Math.max(2,Math.floor(cl(t/30)*P.length)+2), pts=P.slice(0,Math.min(n,P.length)).map((y,i)=>[i*860/(P.length-1),220-y]);
 const d='M'+pts.map(p=>p.join(' ')).join(' L');document.getElementById('line').setAttribute('d',d);
 document.getElementById('area').setAttribute('d',d+` L${pts[pts.length-1][0]} 230 L0 230 Z`);
 document.getElementById('live').style.opacity=(Math.floor(t*2)%2)?.45:1;
};
</script></body></html>
